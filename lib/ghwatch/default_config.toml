[project]
poll_interval = "10m"
discovery_interval = "2h"
retry_after = "10m"
max_workers = 2
candidate_limit = 20
worktree_root = ".worktrees"
# Run in the task worktree when it starts waiting for a person; "" disables it.
human_wait_cleanup = "git clean -fdX"
branch_prefix = "ghwatch/issue-"
review_all_open_prs = true
# Issues asking for harmful behavior: "discussion" (ask a maintainer) or "skip".
harmful_issues = "discussion"

[github]
status_labels = true
# Logins to mention in questions asked on PRs; empty means the repository owner.
human_mentions = []
auto_merge = true
merge_method = "merge"
# Merge the base branch into PRs that are behind it before reviewing them.
update_pr_branches = true
# Use a language name/tag (e.g. "ja") or infer it from the process environment.
human_language = "auto"
close_issue_after_merge = true
require_green_checks = true

[triage]
# Issues unchanged since their last assessment are not judged again until
# this long has passed; deferred ones are also judged again after a merge.
reassess_after = "1d"

[triage.screening]
# A decision model (TypeSafe Jev) settles issues that need no action now
# (deferred, followup, skip) when it is confident; the rest go to the LLM.
# Needs a TypeSafe API key in the environment variable named below.
enabled = false
model = "jev-latest"
api_key_env = "TYPESAFE_API_KEY"
min_confidence = 0.8

[runners.claude]
command = "claude"
timeout = "90m"

[runners.codex]
command = "codex"
timeout = "90m"

[runners.opencode]
command = "opencode"
timeout = "90m"

[roles.triage]
prompt = "triage.md"

[[roles.triage.models]]
runner = "opencode"
model = "openai/gpt-6-luna"
fallback_on = ["capacity", "quota"]

[[roles.triage.models]]
runner = "claude"
model = "sonnet"

[roles.worker]
prompt = "worker.md"

[[roles.worker.models]]
runner = "claude"
model = "sonnet"
fallback_on = ["capacity", "quota"]

[[roles.worker.models]]
runner = "codex"
model = "gpt-5.6-luna"

[roles.reviewer]
prompt = "reviewer.md"

[[roles.reviewer.models]]
runner = "opencode"
model = "openai/gpt-6-luna"
fallback_on = ["capacity", "quota"]

[[roles.reviewer.models]]
runner = "claude"
model = "sonnet"

[roles.deep_reviewer]
prompt = "deep_reviewer.md"

[[roles.deep_reviewer.models]]
runner = "opencode"
model = "openai/gpt-6.1-sol"
fallback_on = ["capacity", "quota"]

[[roles.deep_reviewer.models]]
runner = "claude"
model = "opus"

[roles.finalizer]
prompt = "finalizer.md"

[[roles.finalizer.models]]
runner = "claude"
model = "sonnet"
fallback_on = ["capacity", "quota"]

[[roles.finalizer.models]]
runner = "codex"
model = "gpt-5.6-luna"
